<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gamap</title>
  <meta name="description" content="太鼓の達人の設置店舗と筐体情報（料金・曲数・台数・シリアル）を地図で確認できます。">
  <!-- ホーム画面に追加したときのアプリ設定 -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#e8442e">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gamap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="don" aria-hidden="true"></span>
      <h1>Gamap</h1>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="店舗名・市区町村・地名・シリアルで検索" autocomplete="off">
    </div>
    <button id="toggleSide" class="icon-btn only-mobile" aria-label="一覧を開く">一覧</button>
  </header>

  <main class="layout">
    <aside id="side" class="side">
      <section class="filters">
        <div class="row">
          <label>地方
            <select id="region"><option value="">すべて</option></select>
          </label>
          <label>都道府県
            <select id="pref"><option value="">すべて</option></select>
          </label>
        </div>
        <div class="row">
          <label>台数
            <select id="units">
              <option value="0">指定なし</option>
              <option value="2">2台以上</option>
              <option value="3">3台以上</option>
              <option value="4">4台以上</option>
            </select>
          </label>
          <label>表示
            <select id="extra">
              <option value="">すべて</option>
              <option value="store">位置が正確な店舗のみ</option>
              <option value="unknown">情報募集中のみ</option>
              <option value="closing">閉店予定のみ</option>
            </select>
          </label>
        </div>
        <div class="summary"><span id="count">0</span> 店舗 / <span id="unitsTotal">0</span> 台</div>
      </section>

      <details class="news" id="news">
        <summary>新規設置・閉店情報</summary>
        <ul id="newsList"></ul>
      </details>

      <div id="placeNote" class="place-note" hidden></div>
      <ul id="list" class="list"></ul>
      <footer class="credit">
        データ: <span id="source"></span><span id="sourceUpdated"></span>（<span id="generated"></span> 変換）<br>
        <span class="legend"><i class="dot exact"></i>店舗の位置 <i class="dot approx"></i>市区町村付近（おおよそ）</span>
      </footer>
    </aside>

    <div id="map" class="map"></div>
    <button id="locate" class="locate" title="現在地を表示" aria-label="現在地を表示">◎</button>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <script src="data/stores.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
